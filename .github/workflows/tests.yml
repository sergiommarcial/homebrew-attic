name: tests

on:
  push:
    branches: [main]
    paths: ['Formula/**', '.github/workflows/**']
  pull_request:
    paths: ['Formula/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: rubygems-
      - run: brew test-bot --only-tap-syntax
      # Releases push straight to main, so the formula is built and tested on push too.
      - if: hashFiles('Formula/attic.rb') != ''
        run: brew install --build-from-source sergiommarcial/attic/attic
      - if: hashFiles('Formula/attic.rb') != ''
        run: brew test sergiommarcial/attic/attic
      - if: hashFiles('Formula/attic.rb') != ''
        run: brew audit --strict --online sergiommarcial/attic/attic
